model:
  class_path: cosmoford.models_nopatch.StatsCompressorNoPatch
  init_args:
    summary_dim: 8
    summary_hidden_dim: 512
    summary_n_hidden: 3
    summary_dropout_rate: 0.1
    use_ps: false
    use_hos: true
    use_scattering: false
    hos_l1_only: true
    hos_n_scales: 4
    hos_l1_nbins: 80
    hos_l1_min_snr: -7.0
    hos_l1_max_snr: 7.0
    augment_flip: false
    augment_shift: false
    warmup_steps: 500
    max_lr: 0.002
    decay_rate: 0.85
    decay_every_epochs: 1
    loss_type: log_prob
    use_flow: true
    flow_transforms: 4
    flow_hidden_dim: 64
    lr_schedule: step
    n_val_noise: 8
    use_fixed_normalization: true
data:
  class_path: cosmoford.dataset.ChallengeDataModule
  init_args:
    batch_size: 256
    num_workers: 12
    max_train_samples: 20200
trainer:
  max_epochs: 30
  accelerator: gpu
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  callbacks:
  - class_path: LearningRateMonitor
    init_args:
      logging_interval: step
  - class_path: cosmoford.trainer.EMAWeightAveraging
  - class_path: ModelCheckpoint
    init_args:
      monitor: val_nll
      mode: min
      save_top_k: 3
      save_last: true
      filename: epoch={epoch:02d}-step={step}-val_nll={val_nll:.4f}
  logger:
    class_path: WandbLogger
    init_args:
      name: compressor_explore_l1_flow_s_budget20200
      project: neurips-wl-challenge-hos-compression
      entity: cosmostat
      tags:
      - compressor-explore
      - l1
      - flow_s
      log_model: true
